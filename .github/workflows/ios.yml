name: iOS Build & Tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: LameKit package tests (macOS)
        run: swift test --package-path Packages/LameKit

      - name: Build for iPhone (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DemonicGraphAudiolyzer.xcodeproj \
            -scheme DemonicGraphAudiolyzer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build-device.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = []
          for runtime, entries in devices.items():
              if "iOS" not in runtime:
                  continue
              for device in entries:
                  if device["name"].startswith("iPhone") and "Pro Max" not in device["name"]:
                      candidates.append((runtime, device["name"], device["udid"]))
          candidates.sort()
          print(candidates[-1][2])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Unit tests (Swift Testing) on simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project DemonicGraphAudiolyzer.xcodeproj \
            -scheme DemonicGraphAudiolyzer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:DemonicGraphAudiolyzerTests \
            -parallel-testing-enabled NO \
            -derivedDataPath build/sim \
            -resultBundlePath build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee unit-tests.log | grep -E "error:|✘|✔|Test run|Executed|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" unit-tests.log

      - name: UI tests on simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project DemonicGraphAudiolyzer.xcodeproj \
            -scheme DemonicGraphAudiolyzer \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:DemonicGraphAudiolyzerUITests \
            -parallel-testing-enabled NO \
            -derivedDataPath build/sim \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee ui-tests.log | grep -E "error:|Test Case|Executed|skipped|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "TEST SUCCEEDED" ui-tests.log

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d build/UITests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path screenshots || true
          fi
          ls -la screenshots | head -80

      - name: UI test diagnostics
        if: always()
        run: |
          [ -f ui-tests.log ] && sed -n '/=== UI-DIAGNOSE/,/UI-DIAGNOSE ENDE/p' ui-tests.log | head -400 || true

      - name: Publish screenshots to ci-screenshots branch (temporary design review)
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p review
          for f in screenshots/*; do
            case "$f" in *.png|*.jpg|*.jpeg|*.heic) ;; *) continue ;; esac
            name=$(basename "$f")
            sips -s format jpeg -s formatOptions 80 -Z 1400 "$f" --out "review/${name%.*}.jpg" >/dev/null 2>&1 || true
          done
          [ -f screenshots/manifest.json ] && cp screenshots/manifest.json review/
          ls review/*.jpg >/dev/null 2>&1 || exit 0
          cd review
          git init -q
          git config user.name "ci-screenshots"
          git config user.email "ci-screenshots@users.noreply.github.com"
          git checkout -q -b ci-screenshots
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots || true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            *.log
            build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
